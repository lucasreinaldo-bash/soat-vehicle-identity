# Credenciais do serviço de identidade.
#
# Versionado APENAS para tornar a avaliação reproduzível. Em produção, este
# Secret viria de Sealed Secrets, External Secrets Operator ou de um cofre
# gerenciado, e nunca do repositório.
apiVersion: v1
kind: Secret
metadata:
  name: identity-secret
  namespace: vehicle-identity
  labels:
    app.kubernetes.io/part-of: vehicle-identity
type: Opaque
stringData:
  POSTGRES_PASSWORD: 'keycloak'
  KC_BOOTSTRAP_ADMIN_USERNAME: 'admin'
  KC_BOOTSTRAP_ADMIN_PASSWORD: 'admin'
