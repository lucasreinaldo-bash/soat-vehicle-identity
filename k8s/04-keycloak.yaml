# Keycloak com o realm vehicle-sales importado na inicialização.
# O realm vem do ConfigMap vehicle-sales-realm, gerado pelo deploy.sh a partir
# de realm/vehicle-sales-realm.json: o mesmo arquivo usado no Docker Compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: vehicle-identity
  labels:
    app: keycloak
    app.kubernetes.io/part-of: vehicle-identity
spec:
  replicas: 1
  # Em modo de desenvolvimento, duas instâncias não formam cluster: a nova só
  # sobe depois de a antiga parar.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        # Preenchido pelo deploy.sh com o hash da configuração e do realm:
        # configuração nova reinicia o pod; configuração igual, não.
        vehicle-identity/config-hash: '__CONFIG_HASH__'
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ['sh', '-c', 'until pg_isready -h identity-db -p 5432; do echo aguardando banco; sleep 2; done']
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args: ['start-dev', '--import-realm']
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: identity-config
          env:
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: identity-secret, key: POSTGRES_PASSWORD }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: identity-secret, key: KC_BOOTSTRAP_ADMIN_USERNAME }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: identity-secret, key: KC_BOOTSTRAP_ADMIN_PASSWORD }
          # O Keycloak demora para subir na primeira vez (cria o schema e importa
          # o realm). A startupProbe dá esse tempo sem afrouxar a liveness.
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: management }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: vehicle-sales-realm
---
# Endereço interno usado pela API de vendas para buscar as chaves públicas:
# keycloak.vehicle-identity.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: vehicle-identity
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
